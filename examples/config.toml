[run]
max_cost_usd = "0.10"
max_attempts_per_step = 2
max_wall_seconds = 30
edit_risk = "medium"
category = "protocol-smoke"

[execution]
allowed_executables = ["python3"]
allowed_python_modules = ["compileall"]
protected_paths = ["examples/stdio_bridge.py", "tests", "pyproject.toml"]
max_timeout_seconds = 30
max_output_bytes = 100000

[[validation]]
argv = ["python3", "-m", "compileall", "-q", "src"]

[bridges.protocol_smoke]
command = ["python3", "examples/stdio_bridge.py"]
allowed_executable_names = ["python3"]
timeout_seconds = 10
max_response_bytes = 100000

[[models]]
provider = "local"
model = "protocol-smoke"
adapter = "protocol_smoke"
capabilities = ["plan", "edit", "review"]
max_risk = "high"
input_cost_per_1k = "0"
output_cost_per_1k = "0"
quality_prior = "0.80"
latency_ms = 10
