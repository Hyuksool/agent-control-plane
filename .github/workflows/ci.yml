name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests examples
      - run: ruff check src tests examples
      - run: mypy src
      - run: bandit -r src -ll
      - run: python -m pytest -q
      - run: python -m pip wheel . --no-deps --wheel-dir /tmp/dist
      - run: python -m agent_control_plane.cli demo --workspace /tmp/acp-demo
      - run: python -m agent_control_plane.cli benchmark
